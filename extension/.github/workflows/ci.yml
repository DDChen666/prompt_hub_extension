name: CI

on:
  push:
    branches: [ main, master ]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_E2E: "false"
    defaults:
      run:
        working-directory: extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install deps
        run: pnpm i --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit only by default)
        run: pnpm test

      - name: Playwright Browsers
        if: env.RUN_E2E == 'true'
        run: npx playwright install --with-deps

      - name: E2E
        if: env.RUN_E2E == 'true'
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Zip
        run: pnpm zip

      - name: Manifest Guard
        run: pnpm guard

      - name: Upload dist.zip
        uses: actions/upload-artifact@v4
        with:
          name: dist-zip
          path: extension/dist.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pnpm i --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build && pnpm zip
      - run: node scripts/manifest-guard.mjs
      - run: pnpm run release:sha
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-pack
          path: |
            extension/dist.zip
            extension/dist.zip.sha256
            extension/RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: extension/RELEASE_NOTES.md
          files: |
            extension/dist.zip
            extension/dist.zip.sha256
